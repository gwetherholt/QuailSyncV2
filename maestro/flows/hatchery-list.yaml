# feature: Hatchery list
# description: Opens the Hatchery tab and shows the clutch and chick-group sections loaded from the server.
appId: com.quailsync.app
name: hatchery-list
---
- launchApp
- tapOn:
    id: "nav_hatchery"
# hatchery_list is the clutch/chick-group LazyColumn. It exists on this screen
# alone, so it fails if the tap never lands -- unlike the title "Hatchery",
# which is also the bottom-nav label. Note this is stricter than the regex it
# replaces: the empty-state placeholder is a different composable and carries no
# tag, so an empty hatchery now fails the flow rather than passing it.
- assertVisible:
    id: "hatchery_list"
- takeScreenshot: hatchery-list
