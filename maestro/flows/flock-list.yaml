# feature: Flock list
# description: Opens the Flock tab and shows the list of birds loaded from the server.
appId: com.quailsync.app
name: flock-list
---
- launchApp
- tapOn:
    id: "nav_flock"
# flock_bird_list is the bird LazyColumn, which exists on this screen alone --
# unlike the title "Flock", which is also the bottom-nav label and so is visible
# from every tab. Replaces the old "Records" filter-chip workaround.
- assertVisible:
    id: "flock_bird_list"
# And the count header proves the birds actually loaded from the server, rather
# than the list rendering empty. No tag covers the header, so this stays text.
# Anchored to the header's own wording; a bare "N birds" would also match the
# Dashboard's hutch cards.
- assertVisible: ".*[0-9]+ birds?.*"
- takeScreenshot: flock-list
